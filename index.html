<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ManaNotes — Notes, to-do & ringkasan</title>
  <meta name="description" content="Notes dan to-do list dengan ringkasan otomatis. Rapi, gelap, dan enak dipakai." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">
    <header class="appbar">
      <a class="brand" href="#" data-view="dashboard" aria-label="ManaNotes">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-name">
          ManaNotes
          <small>notes & tasks</small>
        </span>
      </a>

      <label class="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.4-3.4" />
        </svg>
        <input id="search-input" type="search" placeholder="Cari koleksi..." autocomplete="off" spellcheck="false" aria-label="Cari" />
        <kbd>/</kbd>
      </label>

      <div class="appbar-actions">
        <span class="local-chip"><span class="local-dot"></span>Tersimpan lokal</span>
        <button class="btn btn-primary" id="btn-new-note" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Catatan baru</span>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="side-section">
          <span class="side-label">Menu</span>
          <nav class="nav" aria-label="Menu utama">
            <button class="nav-btn is-active" type="button" data-view="dashboard">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.2" y="3.2" width="7.2" height="7.2" rx="2" />
                <rect x="13.6" y="3.2" width="7.2" height="7.2" rx="2" />
                <rect x="3.2" y="13.6" width="7.2" height="7.2" rx="2" />
                <rect x="13.6" y="13.6" width="7.2" height="7.2" rx="2" />
              </svg>
              <span>Beranda</span>
            </button>
            <button class="nav-btn" type="button" data-view="todo">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
                <path d="m8 12.4 2.7 2.7L16.4 9" />
              </svg>
              <span>To-do</span>
              <span class="badge" id="nav-todo-count">0</span>
            </button>
          </nav>
        </div>

        <div class="side-section side-collections">
          <div class="side-label-row">
            <span class="side-label">Koleksi</span>
            <button class="mini-add" type="button" data-action="new-collection" aria-label="Koleksi baru" title="Koleksi baru">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
          </div>
          <div class="collection-list" id="sidebar-collections"></div>
        </div>

        <div class="sidebar-footer">
          <div class="side-progress">
            <div class="ring" id="side-ring" style="--pct: 0">
              <div><span id="side-ring-pct">0%</span></div>
            </div>
            <div class="side-progress-copy">
              <strong id="side-progress-title">Belum ada to-do</strong>
              <p id="side-progress-sub">Tambahkan checklist di catatan</p>
            </div>
          </div>
        </div>
      </aside>

      <main class="main" id="main">
        <section class="view" id="view-dashboard" aria-label="Beranda"></section>
        <section class="view" id="view-collection" aria-label="Koleksi" hidden></section>
        <section class="view" id="view-todo" aria-label="Semua to-do" hidden></section>
      </main>
    </div>
  </div>

  <!-- Note editor -->
  <dialog class="editor" id="note-dialog" aria-label="Editor catatan">
    <div class="editor-bar">
      <button class="icon-btn" id="editor-close" type="button" aria-label="Tutup editor">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <div class="editor-crumb">
        <span class="dot theme-ember" id="editor-dot" aria-hidden="true"></span>
        <span id="editor-collection">Koleksi</span>
      </div>
      <span class="save-state" id="save-state">Tersimpan</span>
      <button class="icon-btn danger" id="editor-delete" type="button" title="Hapus catatan" aria-label="Hapus catatan">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M9.5 7V5h5v2M6.5 7l.9 12.2a1.8 1.8 0 0 0 1.8 1.8h5.6a1.8 1.8 0 0 0 1.8-1.8L18.5 7" />
          <path d="M10.2 11v5.5M13.8 11v5.5" />
        </svg>
      </button>
    </div>

    <div class="editor-scroll">
      <div class="editor-cover theme-ember" id="editor-cover">
        <div class="cover-art"></div>
        <div class="cover-shade"></div>
      </div>

      <div class="editor-inner">
        <div class="editor-main">
          <input class="title-input" id="note-title" type="text" placeholder="Tanpa judul" maxlength="120" autocomplete="off" />
          <div class="editor-meta">
            <span id="editor-date"></span>
            <span class="meta-sep">·</span>
            <span id="editor-task-count"></span>
          </div>
          <textarea class="body-input" id="note-body" placeholder="Mulai tulis catatanmu..." spellcheck="false"></textarea>
        </div>

        <aside class="editor-side">
          <section class="side-card">
            <header class="side-card-head">
              <h4>To-do</h4>
              <span class="side-card-count" id="task-progress-text">0/0</span>
            </header>
            <div class="bar bar--slim"><span id="task-progress-bar" style="width: 0%"></span></div>
            <ul class="task-list" id="task-list"></ul>
            <form class="task-form" id="task-form">
              <input id="task-input" type="text" placeholder="Tambah tugas..." maxlength="120" autocomplete="off" />
              <button type="submit" aria-label="Tambah tugas">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
            </form>
          </section>

          <section class="side-card summary-card">
            <header class="side-card-head">
              <h4>Ringkas</h4>
              <span class="spark" aria-hidden="true">✦</span>
            </header>
            <p class="side-hint">Ambil poin penting dari catatan ini dalam sekali klik.</p>
            <button class="btn btn-ghost btn-full" id="summarize-btn" type="button">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9L12 3.5Z" />
                <path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z" />
              </svg>
              <span>Ringkas catatan</span>
            </button>
            <div class="summary-output" id="summary-output"></div>
          </section>
        </aside>
      </div>
    </div>
  </dialog>

  <!-- Collection dialog -->
  <dialog class="modal" id="collection-dialog" aria-label="Koleksi">
    <form id="collection-form">
      <header class="modal-head">
        <div>
          <span class="eyebrow">Koleksi</span>
          <h3 id="collection-dialog-title">Koleksi baru</h3>
        </div>
        <button class="icon-btn" type="button" data-close-dialog aria-label="Tutup">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <div class="field">
        <label for="collection-name">Nama koleksi</label>
        <input id="collection-name" type="text" placeholder="Misal: Kuliah" maxlength="40" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="collection-subtitle">Deskripsi singkat</label>
        <input id="collection-subtitle" type="text" placeholder="Notes & Tasks" maxlength="60" autocomplete="off" />
      </div>
      <div class="field">
        <span class="field-label">Warna sampul</span>
        <div class="theme-picker" id="theme-picker"></div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="collection-delete" type="button" hidden>Hapus koleksi</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close-dialog>Batal</button>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text">Tersimpan</span>
    <button type="button" id="toast-action" hidden>Urungkan</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
